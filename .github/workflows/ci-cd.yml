name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. Backend CI: Linting, Type Checking & Tests
  # ===========================================================================
  backend-ci:
    name: Backend CI (Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies with dev extras
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with Mypy
        run: uv run mypy app/

      - name: Run Pytest test suite
        env:
          GEMINI_API_KEY: dev-placeholder-ci-key
          ENVIRONMENT: test
        run: uv run pytest

  # ===========================================================================
  # 2. Frontend CI: Linting, Type Checking, Tests & Production Build
  # ===========================================================================
  frontend-ci:
    name: Frontend CI (ESLint, Typecheck, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Type check with TypeScript compiler
        run: npm run typecheck

      - name: Lint with ESLint
        run: npm run lint

      - name: Run Vitest test suite
        run: npm run test -- --run

      - name: Verify production build
        env:
          VITE_API_BASE_URL: https://decodeai-backend.onrender.com
        run: npm run build

  # ===========================================================================
  # 3. CD: Deploy Backend to Render via Webhook
  # ===========================================================================
  deploy-backend:
    name: Deploy Backend to Render
    needs: [backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deploy Hook
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_BACKEND_DEPLOY_HOOK}" ]; then
            echo "::notice::RENDER_BACKEND_DEPLOY_HOOK secret is not set. Skipping backend deployment webhook."
          else
            echo "Triggering backend deployment webhook..."
            HTTP_CODE=$(curl -s -S -o /dev/null -w "%{http_code}" -X POST "${RENDER_BACKEND_DEPLOY_HOOK}")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Backend deployment triggered successfully (HTTP ${HTTP_CODE})."
            else
              echo "::error::Render backend deploy hook responded with HTTP ${HTTP_CODE}"
              exit 1
            fi
          fi

  # ===========================================================================
  # 4. CD: Deploy Frontend to Render via Webhook (after Backend)
  # ===========================================================================
  deploy-frontend:
    name: Deploy Frontend to Render
    needs: [frontend-ci, deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Frontend Deploy Hook
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_FRONTEND_DEPLOY_HOOK}" ]; then
            echo "::notice::RENDER_FRONTEND_DEPLOY_HOOK secret is not set. Skipping frontend deployment webhook."
          else
            echo "Triggering frontend deployment webhook..."
            HTTP_CODE=$(curl -s -S -o /dev/null -w "%{http_code}" -X POST "${RENDER_FRONTEND_DEPLOY_HOOK}")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Frontend deployment triggered successfully (HTTP ${HTTP_CODE})."
            else
              echo "::error::Render frontend deploy hook responded with HTTP ${HTTP_CODE}"
              exit 1
            fi
          fi
