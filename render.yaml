## 6. Production Setup & Operator Next Steps

To deploy the application live to your Render account, follow these operational steps:

### Step 1: Create Services in Render
**Option A — Via Blueprint (Recommended):**
1. Push this repository to GitHub.
2. In the Render Dashboard, select **New +** $\rightarrow$ **Blueprint**.
3. Connect your repository. Render will automatically detect [render.yaml](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/render.yaml) and configure `decodeai-backend` and `decodeai-frontend`.

**Option B — Manual Setup:**
- Refer to Section 3.2 in [DEPLOYMENT.md](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/DEPLOYMENT.md) for manual form fields.

### Step 2: Configure Environment Variables in Render
- **`decodeai-backend`**:
  - `GEMINI_API_KEY`: Your Google AI Studio API key (`AIza...`).
  - `GROQ_API_KEY`: Your Groq API key (`gsk_...`) for fallback.
  - `ENVIRONMENT`: `production`.
  - `ALLOWED_ORIGINS`: `https://decodeai-frontend.onrender.com` (replace with your frontend Render URL).
- **`decodeai-frontend`**:
  - `VITE_API_BASE_URL`: `https://decodeai-backend.onrender.com` (replace with your backend Render URL).

### Step 3: Configure GitHub Repository Secrets
In GitHub, navigate to **Settings** $\rightarrow$ **Secrets and variables** $\rightarrow$ **Actions** and add:
- `RENDER_BACKEND_DEPLOY_HOOK`: The deploy hook URL generated by Render for `decodeai-backend` (found in service Settings $\rightarrow$ Deploy Hook).
- `RENDER_FRONTEND_DEPLOY_HOOK`: The deploy hook URL generated by Render for `decodeai-frontend`.

### Step 4: Verification Smoke Test
Once deployed, perform the 6-step smoke-test:
1. **Root Health**: `curl https://<backend-host>/health` $\rightarrow$ `{"status":"ok",...}`.
2. **API Health**: `curl https://<backend-host>/api/health` $\rightarrow$ `{"status":"ok",...}`.
3. **Frontend Load**: Navigate to `https://<frontend-host>/`. Verify the slideshow presentation container, chapter navigation, and clean product layout render without error.
4. **Fixture Demo**: Click **View Sample Lesson**. Confirm slides step smoothly through diagrams, explanations, and verification checklists.
5. **Live Generation**: Submit a technical topic (e.g. *“Explain Database Indexing”*). Confirm the primary generator synthesizes the lesson, and browser-native narration operates correctly.
6. **Free-Tier Waking**: If the service has been idle (>15 min), ensure the frontend's 3-phase loading animation gracefully covers the Render cold-start latency.

