## 3. Render Blueprint Architecture (`render.yaml`)

```yaml
services:
  - type: web
    name: decodeai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install uv && uv sync --no-dev"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: decodeai-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
```

### Critical Blueprint Design Choices:
1. **`autoDeploy: false`**: Automatic git push deployment on Render is disabled. This prevents race conditions or duplicate builds, ensuring deployments occur **only** after CI checks pass on `main`.
2. **Fast & Deterministic Builds**: The backend build uses `pip install uv && uv sync --no-dev`, providing fast dependency resolution from `uv.lock`.
3. **Secret Isolation**: `GEMINI_API_KEY`, `GROQ_API_KEY`, `ALLOWED_ORIGINS`, and `VITE_API_BASE_URL` are marked `sync: false`, requiring them to be populated in Render’s dashboard to prevent commit leakage.

