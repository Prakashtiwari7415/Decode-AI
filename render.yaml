## 4. GitHub Actions CI/CD Pipeline

The pipeline in [.github/workflows/ci-cd.yml](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/.github/workflows/ci-cd.yml) enforces strict quality gates:

```mermaid
flowchart TD
    Trigger([Push to main or Pull Request]) --> BackendCI[backend-ci Job]
    Trigger --> FrontendCI[frontend-ci Job]

    subgraph CI Quality Gates
      BackendCI --> B1[Ruff Lint Check]
      BackendCI --> B2[Mypy Strict Typecheck]
      BackendCI --> B3[Pytest Unit + Integration Tests]

      FrontendCI --> F1[TypeScript Typecheck]
      FrontendCI --> F2[ESLint Check]
      FrontendCI --> F3[Vitest Suite]
      FrontendCI --> F4[Vite Production Build]
    end

    BackendCI -->|Passes & On main| DeployBackend[deploy-backend Job]
    DeployBackend -->|Trigger Backend Deploy Hook| RenderBackend[(Render Backend Service)]

    FrontendCI -->|Passes & On main| DeployFrontend[deploy-frontend Job]
    DeployBackend -->|Sequential Dependency| DeployFrontend
    DeployFrontend -->|Trigger Frontend Deploy Hook| RenderFrontend[(Render Static Frontend)]
```

### Security & Operational Safeguards:
- **No Token Leakage**: The webhook triggers suppress query strings and body output:
  ```bash
  HTTP_STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}")
  ```
- **PR Safety**: Pull Requests execute all linting, typechecking, and test suites across backend and frontend, but the `deploy-*` jobs are skipped via `if: github.ref == 'refs/heads/main' && github.event_name == 'push'`.
- **Sequential Deployment**: Frontend deployment waits on backend deployment completion (`needs: [frontend-ci, deploy-backend]`), avoiding client downtime against outdated API contracts.

