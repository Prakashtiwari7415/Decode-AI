# DecodeAI — Production Deployment and CI/CD Architecture Report

This report outlines the production deployment configuration and GitHub Actions CI/CD pipeline implemented for **DecodeAI**. 

The solution preserves DecodeAI’s existing architecture:
- **Frontend**: React 18 + TypeScript + Vite + Tailwind CSS with the interactive presentation slideshow UI.
- **Backend**: FastAPI + Python 3.12 with Gemini 2.5 Flash as primary generator and Groq Llama 3.3 70B Versatile as automatic fallback.
- **Storage**: DecodeAI is completely **stateless** — no database, migrations, or object storage are required or introduced.
- **Free-Tier Target**: Native deployment on **Render** (Python Web Service for backend + Static Site for frontend).

---

## 1. Repository Audit & Architecture Adjustments

Before making any infrastructure changes, we audited the existing codebase to identify production gaps:

| Area | Audit Finding | Production Fix Applied |
| :--- | :--- | :--- |
| **Database & Migrations** | No database or ORM is used. Lessons are synthesized on-demand or served from predefined fixtures. | Retained purely stateless architecture; no SQL database or Alembic migrations added. |
| **CORS Origins** | `ALLOWED_ORIGINS` in [backend/app/config.py](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/backend/app/config.py) needed to handle trailing slashes and JSON array formats. | Origin parsing now automatically trims whitespace, strips trailing slashes (`.rstrip("/")`), and accepts comma-separated lists or JSON arrays. |
| **Health Checks** | Health endpoints were only under `/api/health`. Some PaaS default root probes hit `/` or `/health`. | Mounted [health.py](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/backend/app/routers/health.py) at root (`/`, `/health`) as well as `/api/health`. Added integration tests. |
| **Vite Client Routing** | Single-Page Application (SPA) direct navigation to subpaths on static hosting causes 404s without URL rewriting. | Added [frontend/public/_redirects](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/frontend/public/_redirects) (`/* /index.html 200`) and configured SPA rewrites in [render.yaml](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/render.yaml). |
| **API Base URL Sanitization** | Trailing slashes on `VITE_API_BASE_URL` could produce double slashes like `//api/lessons/generate`. | Sanitized in [frontend/src/services/api.ts](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/frontend/src/services/api.ts) with `.trim().replace(/\/+$/, '')`. |
| **CI/CD Redundancy** | Two separate workflows (`ci-backend.yml`, `ci-frontend.yml`) existed with no deployment integration. | Consolidated into a single unified pipeline [.github/workflows/ci-cd.yml](file:///home/neha-tiwari/Prakash's%20Folder/Decode%20AI/.github/workflows/ci-cd.yml) with automated, gated Render deploy hooks. |

